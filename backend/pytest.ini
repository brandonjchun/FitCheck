[pytest]
testpaths = tests

# Puts `backend/` on sys.path so tests can `import app`. Without this, pytest
# only adds the directory containing the test file, and every import fails.
# Run pytest from `backend/` -- app.config reads .env relative to the CWD.
pythonpath = .

# Show the reason for skips/xfails in the summary rather than a bare count.
addopts = -ra
