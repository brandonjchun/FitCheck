<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>FitCheck — resume/JD matching with explainable scoring</title>
    <meta
      name="description"
      content="FitCheck derives a structured profile from your resume and from a job posting, then scores the pair on semantic similarity and weighted skill overlap — returning the full breakdown, not a bare percentage."
    />

    <!-- Paints the browser chrome to match the page in both themes, so the
         address bar does not sit as a bright band above a dark hero. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfaff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16151f" />

    <meta property="og:title" content="FitCheck" />
    <meta
      property="og:description"
      content="Know why you fit — not just whether you do."
    />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
