# Local development infrastructure. Postgres for durable state, Redis as the
# queue broker, and worker processes that run the slow work. Everything runs
# in Linux containers, which is how these run in production -- no
# Windows-specific builds or ports involved.

# Pin the project name instead of letting Compose derive it from the directory.
# Derived names follow the folder, so renaming the checkout would change the
# prefix on every container, network, and volume -- and a renamed `pgdata`
# volume reads as an empty database rather than an error.
name: fitcheck

services:
  postgres:
    # pgvector/pgvector rather than the plain postgres image: it is the
    # official Postgres image with the pgvector extension already compiled in.
    # M6 stores 384-dimension embeddings in this database, and swapping the
    # image later means rebuilding the volume. Cheaper to start here.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fitcheck
      # From the root .env, which is gitignored. `:?` makes Compose refuse to
      # start rather than silently defaulting, so a missing value is a loud
      # error instead of a database with a password someone has to guess.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: fitcheck
    ports:
      # Bound to loopback, NOT 0.0.0.0. Docker publishes to every interface by
      # default, and it does so by writing DNAT rules into the DOCKER iptables
      # chain -- which is traversed before UFW's rules, so `ufw deny 5432`
      # does not close it. On a host with a public IP the unqualified form
      # exposes this database to the internet while the firewall reports the
      # port as blocked. Loopback keeps psql working locally and nothing else.
      - "127.0.0.1:5432:5432"
    volumes:
      # Named volume, NOT a bind mount. Without this line every
      # `docker compose down` destroys the database.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `docker compose ps` reports healthy/unhealthy instead of just
      # "running", and workers can wait on this once they exist.
      test: ["CMD-SHELL", "pg_isready -U fitcheck -d fitcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    # Redis has no password by default and is one of the most heavily scanned
    # ports on the internet. It also holds the session store here, so read
    # access to it is read access to every logged-in account.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (see .env.example)}"]
    environment:
      # redis-cli reads REDISCLI_AUTH automatically, which keeps the password
      # out of the healthcheck's argv -- `-a` would put it in `ps` output and
      # emit a warning on every probe.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    ports:
      # Loopback only, for the same reason as Postgres above.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Two worker classes, and the difference between them is the whole point of
  # running four queues.
  #
  #   worker-interactive  drains `interactive scoring ingest`, in that order
  #   worker-bulk         drains `ingest` only
  #
  # RQ takes queues in the order given on the command line and checks them in
  # that order every time it looks for work. So the interactive worker helps
  # clear a backlog when nothing else is waiting, but the moment a user
  # submits a URL, that job is the next thing it picks up -- ahead of however
  # many thousand batch items are queued behind it.
  #
  # The bulk workers never touch `interactive`, so scaling them up adds
  # throughput for batch and crawl work without any of them being able to
  # starve a user-facing request:
  #
  #   docker compose up -d --scale worker-bulk=4
  worker-interactive: &worker
    # Runs on Linux so RQ can fork a child process per job. On Windows the
    # host would need SimpleWorker, which executes jobs in-process and loses
    # the crash isolation that forking provides.
    build:
      context: ./backend
    command: >
      rq worker --url redis://:${REDIS_PASSWORD}@redis:6379/0
      interactive scoring ingest
    depends_on:
      # Wait for readiness, not just "container started". Postgres accepts
      # connections several seconds after the process launches, and a worker
      # that starts inside that gap dies on its first query.
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      # Picks up LLM_PROVIDER, GEMINI_API_KEY, GEMINI_MODEL, OLLAMA_MODEL.
      # Compose only auto-loads a .env at the project root, and this one
      # lives under backend/, so it has to be named explicitly.
      - ./backend/.env
    environment:
      # These override env_file (explicit `environment` wins) because the
      # values in .env are written for a process running on the Windows host
      # and are wrong inside the compose network.
      #
      # Service names, not localhost: `postgres` and `redis` resolve to the
      # sibling containers. A worker pointed at localhost would be looking at
      # itself and find nothing listening.
      # Passwords come from the root .env via Compose substitution, so no
      # credential is committed. Both are generated with `secrets.token_urlsafe`,
      # whose alphabet is URL-safe -- so they need no percent-encoding when
      # embedded in these URLs.
      DATABASE_URL: postgresql+psycopg://fitcheck:${POSTGRES_PASSWORD}@postgres:5432/fitcheck
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Pool sized for this role, not copied from the API tier. A worker runs
      # one job at a time and its tasks open sessions one after another, so
      # the real working set is a single connection; 2 + 2 is slack, not need.
      #
      # This matters because the ceiling is per process. The API default of
      # 5 + 5 applied here would mean 10 connections per worker, so
      # `--scale worker=8` alone reserves 80 of Postgres's default 100 and the
      # next connection -- from the API, or from psql -- is refused. At 2 + 2
      # the same scale costs 32 and leaves room to actually debug it.
      DB_POOL_SIZE: 2
      DB_MAX_OVERFLOW: 2
      # Ollama runs on the Windows host, not in this container.
      # host.docker.internal is how a container reaches back out to it.
      OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      # Required on Linux hosts; a no-op but harmless on Docker Desktop.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  worker-bulk:
    # Everything above, with one thing changed: the queue list.
    #
    # The YAML merge is not just brevity. These two must agree on database
    # URL, pool size, and provider settings -- a bulk worker with a different
    # DATABASE_URL is a bug that shows up as "some jobs vanish", so sharing
    # one definition is what stops them drifting.
    <<: *worker
    # `ingest` alone. No fallback to `interactive`, deliberately: the entire
    # guarantee is that scaling this service up cannot consume capacity a
    # user-facing submission needs.
    #
    # Concurrency is the number of processes, so this is the dial to turn when
    # a 2,000-item batch needs to drain faster:
    #   docker compose up -d --scale worker-bulk=4
    command: >
      rq worker --url redis://:${REDIS_PASSWORD}@redis:6379/0
      ingest

volumes:
  pgdata:
